# ~/.config/tmux/tmux.conf - faerieconfig

# =============================================================================
# General
# =============================================================================

# Prefix: Ctrl-\  (WezTerm deliberately leaves C-\ unbound)
unbind C-b
set -g prefix 'C-\'
bind 'C-\' send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
# Not 0: Windows WezTerm reaches WSL through ConPTY, which can split escape
# sequences. With 0, the ESC of a bracketed paste (ESC[200~ ... ESC[201~) is
# taken as a lone Escape key and the markers leak into the pane as text,
# mangling pasted commands and tokens. 50ms fixes it; Esc in nvim still feels
# instant.
set -s escape-time 50
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string '#H:#S.#I.#P #W #T'

# =============================================================================
# Key bindings
# =============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Last pane rebound to `prefix \` (default C-\ is the prefix, so avoid it)
bind '\' last-pane

# --- vim-tmux-navigator: seamless C-h/j/k/l between Neovim and tmux ---------
# Smart pane switching with awareness of Neovim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Synchronize panes
bind S set-window-option synchronize-panes\; display "Sync #{?pane_synchronized,ON,OFF}"

# Copy mode (vi-style)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
# A mouse drag only selects; y or Enter copies. By default tmux copies the
# moment a drag ends -- and with clipboard forwarding (OSC 52) that silently
# replaced the Windows clipboard (e.g. with the prompt's "$") whenever a click
# to focus a pane moved slightly. Shift+drag still uses WezTerm's own selection.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind P paste-buffer

# Quick session switcher
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key b break-pane -d

# =============================================================================
# Julia REPL helpers (assumes REPL in the {right} pane)
# =============================================================================
bind-key R send-keys -t '{right}' C-d \; send-keys -t '{right}' 'julia --project=.' Enter
bind-key C send-keys -t '{right}' C-l

# =============================================================================
# Status bar (TokyoNight Night)
# =============================================================================
set -g status-position bottom
set -g status-style bg='#1a1b26',fg='#c0caf5'
set -g status-left-length 40
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26] #I/#P '
set -g status-right-length 80
set -g status-right '#[fg=#565f89,bg=#1a1b26] %Y-%m-%d #[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M:%S #[fg=#1a1b26,bg=#9ece6a,bold] #H '
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format '#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W#F '
setw -g window-status-separator ''
setw -g window-status-style fg='#565f89',bg='#1a1b26'
setw -g window-status-current-style fg='#1a1b26',bg='#7aa2f7',bold
set -g pane-border-style fg='#3b4261'
set -g pane-active-border-style fg='#7aa2f7'
set -g message-style fg='#c0caf5',bg='#1a1b26',bold

# =============================================================================
# Plugins (TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# vim-tmux-navigator is configured by hand above; no plugin needed.
# Plugins are cloned by Ansible (roles/tmux), pinned; keep this list in step
# with tmux_plugins in ansible/roles/tmux/defaults/main.yml.

# Restores layout, working directories and nvim. Scrollback is deliberately
# NOT saved: it lands unencrypted on disk, and tokens get pasted into panes.
# nvim comes back via persistence.nvim's per-directory session, not
# resurrect's Session.vim strategy (lua/plugins/session.lua).
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes '"nvim->nvim +SessionRestore"'
# continuum saves every 15 min by hooking status-right, so status-right
# must be set before TPM runs (it is, above).
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
